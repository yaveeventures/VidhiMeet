services:
  migration:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  api:
    build: .
    env_file: .env
    ports: ["8080:8000"]
    depends_on:
      migration: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lexconnect
      POSTGRES_USER: lexconnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U lexconnect"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes","--requirepass","${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
