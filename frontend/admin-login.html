<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — VidhiMeet</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-tokens.css">
  <style>
    :root {
      --admin-bg-dark: #07130e;
      --admin-bg-card: #0e241c;
      --admin-border: rgba(38, 90, 71, 0.4);
      --admin-accent: #10b981;
      --admin-gold: #f59e0b;
      --admin-gold-hover: #d97706;
      --admin-text-main: #f8fafc;
      --admin-text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #123227 0%, #07130e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--admin-text-main);
      padding: 24px;
    }

    .admin-auth-container {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .brand-logo {
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
    }

    .brand-logo i {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #10b981, #047857);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-style: normal;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }

    .console-tag {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 12px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: var(--admin-gold);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .admin-card {
      background: rgba(14, 36, 28, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid var(--admin-border);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .admin-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #10b981, #f59e0b, #10b981);
    }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ffffff;
      text-align: center;
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--admin-text-sub);
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px dashed rgba(16, 185, 129, 0.25);
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      color: #6ee7b7;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--admin-text-sub);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 44px 14px 16px;
      background: rgba(7, 19, 14, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: all 0.2s ease;
    }

    .password-toggle-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      padding: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      border-radius: 6px;
      line-height: 1;
      transition: color 0.15s ease, background-color 0.15s ease;
      z-index: 2;
    }
    .password-toggle-btn:hover {
      color: #f59e0b;
      background-color: rgba(245, 158, 11, 0.1);
    }
    .password-toggle-btn svg {
      width: 18px;
      height: 18px;
      display: block;
      pointer-events: none;
    }

    .input-wrapper input:focus {
      border-color: var(--admin-gold);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
      background: rgba(7, 19, 14, 0.9);
    }

    .input-wrapper input::placeholder {
      color: #475569;
    }

    .error-box {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .btn-admin-submit {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      border-radius: 12px;
      color: #07130e;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-admin-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.45);
      background: linear-gradient(135deg, #fbbf24, #d97706);
    }

    .btn-admin-submit:active {
      transform: translateY(0);
    }

    .btn-admin-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      pointer-events: none;
      transform: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
      flex-shrink: 0;
    }

    .footer-note {
      text-align: center;
      margin-top: 32px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
    }

    .footer-note a {
      color: var(--admin-text-sub);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-note a:hover {
      color: var(--admin-gold);
    }
  </style>
</head>
<body>

<div class="admin-auth-container">
  <div class="brand-header">
    <a href="index.html" class="brand-logo"><img src="logo-white.png" alt="VidhiMeet" height="120" style="height:120px;width:auto;display:block;"></a>
    <div><span class="console-tag">🔒 Admin Portal</span></div>
  </div>

  <div class="admin-card">
    <h1 class="card-title">Administrator Authentication</h1>
    <p class="card-subtitle">Enter your super-admin credentials to access platform controls & management.</p>

    <div class="security-badge">
      <span>🛡️</span>
      <span>256-Bit TLS Encrypted Session · Forensic IP Logging Active</span>
    </div>

    <div class="error-box" id="admin-login-error"></div>

    <div class="form-group">
      <label for="admin-email">Admin Email Address</label>
      <div class="input-wrapper">
        <input type="email" id="admin-email" placeholder="admin@vidhimeet.com" autocomplete="username">
      </div>
    </div>

    <div class="form-group">
      <label for="admin-password">Master Password</label>
      <div class="input-wrapper">
        <input type="password" id="admin-password" placeholder="••••••••••••" autocomplete="current-password">
        <button type="button" class="password-toggle-btn" aria-label="Show password" title="Show password">
          <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>

    <button type="button" class="btn-admin-submit" id="admin-login-btn">
      Sign In to Admin Console →
    </button>
  </div>

  <div class="footer-note">
    <p>© 2026 VidhiMeet Technologies. Restricted Access.</p>
    <p style="margin-top: 6px;"><a href="index.html">← Return to Client Marketplace</a></p>
  </div>
</div>

<script src="js/cookie-consent.js"></script>
<script src="js/api-client.js?v=rev-31"></script>
<script src="js/admin-login.js?v=rev-31"></script>
</body>
</html>
