name: VidhiMeet CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff bandit

      - name: Code Quality & Lint Check (Ruff)
        run: ruff check backend/ tests/ || true

      - name: Static Security Audit (Bandit)
        run: bandit -r backend/ -ll || true

      - name: Run Pytest Test Suite
        run: python -m pytest

  docker-build-verification:
    needs: test-and-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Container Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: vidhimeet-api:latest

