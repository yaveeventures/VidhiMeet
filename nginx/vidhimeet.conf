# ==============================================================================
# VidhiMeet — Nginx Reverse Proxy & TLS Hardening Configuration
# Domain: vidhimeet.in
# Place this file in /etc/nginx/sites-available/vidhimeet.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/vidhimeet.conf /etc/nginx/sites-enabled/
# ==============================================================================

# ── HTTP -> HTTPS Redirect ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name vidhimeet.in www.vidhimeet.in lawyer.vidhimeet.in admin.vidhimeet.in;

    # Certbot ACME Challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Main Application Server ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vidhimeet.in www.vidhimeet.in lawyer.vidhimeet.in admin.vidhimeet.in;

    # SSL Certificate Paths (Managed by Certbot for vidhimeet.in)
    ssl_certificate /etc/letsencrypt/live/vidhimeet.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vidhimeet.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/vidhimeet.in/chain.pem;

    # TLS Security Protocols & Ciphers (Mozilla Modern Standard)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Caching & OCSP Stapling
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client Request Limits
    client_max_body_size 15M; # Supports legal document drafting & verification uploads

    # ── Proxy to FastAPI App / Docker Stack ──────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }

    # ── Real-time WebSocket Proxy Configuration ──────────────────────────────
    location /api/v1/ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s; # Keep websocket open indefinitely
        proxy_send_timeout 86400s;
    }

    # ── Server-Sent Events (SSE) Proxy Configuration ─────────────────────────
    location /api/v1/events/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }
}
